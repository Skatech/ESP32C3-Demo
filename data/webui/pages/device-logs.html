<!DOCTYPE html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="data:,">
	<link rel="stylesheet" href="/styles.css">
	<style>
	div.log {
		overflow-y: auto;
		margin: auto;
		font-family: consolas;
		font-size: 0.9rem;
		word-wrap: break-word;
		white-space: pre;
	}
	</style>
	<title>ESP32-C3 Demo - LOG</title>
</head>
<h1>Device LOG</h1>
<hr>
<div class="links">
	<a href='/'>INDEX</a>
	<a href='/admin'>ADMIN</a>
	<a href='/admin/update'>UPDATE</a>
	<a href='/admin/logout'>LOGOUT</a>
	<a href='/admin/restart'>RESTART</a>
</div>
<div class="log"></div>
<script>
function updateDocument(text) {
	const log = document.querySelector("div.log")
	log.innerText = text
	log.scrollTop = log.scrollHeight
}
window.onload = async function() {
	if (window.location.host) {
		const response = await fetch(window.location.origin + "/data/log")
		if (response.ok) {
			const text = await response.text()
			updateDocument(text)
		}
		else console.log("Data fetch error: " + response.statusText)
	}
}
</script>
