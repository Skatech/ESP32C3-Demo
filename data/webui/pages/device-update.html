<!DOCTYPE html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="data:,">
	<link rel="stylesheet" href="/styles.css">
	<style>
	:root {
		--padding-v: .375rem;
		--padding-h: .75rem;
	}
	form {
		display: flex;
		flex-direction: column;
	}
	label {
		margin-top: 1em;
		margin-bottom: 0.25em;
	}
	input {
		display: block;
		box-sizing: border-box;
		padding: var(--padding-v) var(--padding-h);
		font-size: 1rem;
		font-weight: 400;
		border: 1px solid ButtonBorder;
		border-radius: var(--padding-v);
	}
	input:focus-visible {
		outline: none;
		box-shadow: 0 0 0.2rem SelectedItem;
	}
	input[type=text] {
		width: 100%;
		background-color: inherit;
	}
	input[type=file] {
		width: 100%;
	}
	input[type=file]::file-selector-button {
		padding: inherit;
		margin: calc(0rem - var(--padding-v)) calc(0rem - var(--padding-h));
		margin-inline-end: var(--padding-h);
		border: inherit;
		border-width: 0;
		border-inline-end-width: 1px;
	}
	input[type=submit] {
		width: 7em;
		margin: 2em 0;
		margin-left: auto;
		background-color: AccentColor;
		border-color: AccentColor;
	}
	.hidden {
		visibility: collapse;
	}
	div.log {
		border: 1px solid ButtonBorder;
		border-radius: var(--padding-v);
		margin: 0;
		padding: 5px;
		flex-grow: 1;
		overflow-y: auto;
		white-space: pre;
		font-family: consolas;
		font-size: 0.9rem;
	}
	div.progress {
		box-sizing: border-box;
		width: 100%;
		margin-bottom: 1em;
		border: 1px solid ButtonBorder;
		border-radius: var(--padding-v);
		background-color: ButtonFace;
		overflow: hidden;
		position: relative;
	}
	div.progress :first-child {
		display: table;
		height: 19px;
		width: 0%;
		background: AccentColor;
		text-align: center;
		vertical-align: middle;
	}
	div.progress :last-child {
		position: absolute;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
	}
	</style>
	<title>Device UPDATE</title>
</head>
<h1>Device UPDATE</h1>
<hr>
<div class="links">
	<a href='/'>INDEX</a>
	<a href='/admin'>ADMIN</a>
</div>
<form method="POST" action="#" enctype="multipart/form-data">
	<label>OUTPUT PATH:</label>
	<input type="text" name="path" required disabled>
	<label>UPLOAD FILE:</label>
	<input type="file" name="file" accept="*/*" required>
	<input type="submit" value="Upload">
</form>
<div class="progress hidden"><div></div><div>0%</div></div>
<div class="log"></div>

<script>
	const progress = $("div.progress"), submit = $("input[type=submit]"),
		file = $("input[type=file]"), path = $("input[type=text]"), log = $("div.log")

	/** @param {string} selector, @param {HTMLElement} context @return {HTMLElement|null} */
	function $(selector, context = document) {
		return context.querySelector(selector)
	}

	function updateProgress(percentage) {
		progress.firstChild.style.width = 
			progress.lastChild.innerText = percentage + "%"
		progress.classList.remove("hidden")		
	}

	function writeLog(text) {
		log.innerText += text + "\r\n"
		log.scrollTop = log.scrollHeight
	}

	/** @param {string} url @param {FormData} data @return {Promise<string>} */
	function uploadAsync(url, data) {
		return new Promise(function(resolve, reject) {
			const xhr = new XMLHttpRequest()
			xhr.upload.onprogress = function(evt) {
				if (evt.lengthComputable) {
					updateProgress(Math.round(evt.loaded / evt.total * 100))
					console.log(`Upload progress: ${Math.round(evt.loaded / evt.total * 100)}% (${evt.loaded} / ${evt.total})`)
				}
			}
			xhr.onload = function() {
				if (xhr.status >= 200 && xhr.status < 300)
					resolve(xhr.responseText)
				else reject(new Error(`HTTP Error ${xhr.status} - ${xhr.statusText}`))
			}
			xhr.onerror = function() {
				reject(new Error("Network error"));
			}
			xhr.onabort = function() {
				reject(new Error("Upload aborted"));
			}
			xhr.open("POST", url, true)
			xhr.send(data)
		})
	}

	file.onchange = function(evt) {
		path.value = (path.disabled = evt.target.value.endsWith(".bin"))
			? "DEVICE" : "/webui/pages/" + evt.target.value.match(/[^\\/]+$/)?.at(0)
	}

	$("form").onsubmit = async function(evt) {
		evt.preventDefault()
		if (path.value && file.value && window.location.hostname) {
			const data = new FormData(evt.target)
			submit.disabled = path.disabled = file.disabled = true
			writeLog(path.value === "DEVICE"
				? `Uploading ${file.files[0].name} to DEVICE...`
				: `Uploading ${file.files[0].name} as\r\n\t${path.value}...`)
			try {
				const msg = await uploadAsync(window.location.pathname, data)
				writeLog(msg);
			}
			catch (err) {
				writeLog(err);
			}
			progress.classList.add("hidden")
			submit.disabled = path.disabled = file.disabled = false
			file.value = path.value = null
		}
	}

	file.value = path.value = null
</script>
